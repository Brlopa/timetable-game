services:
  # Option 1: Render Static Site (Recommended: 100% Free, Global CDN, No Sleep)
  - type: web
    name: fahrplan-optimierer
    runtime: static
    buildCommand: cd app && npm install && npm run build
    staticPublishPath: ./app/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /data/*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
